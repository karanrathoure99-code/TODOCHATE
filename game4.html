<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Chapter 5 (Levels 71-100: Time is Life)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020205;
            background: radial-gradient(circle at center, #240505 0%, #0c0205 70%, #020002 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.45;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 {
            width: 450px; height: 450px;
            background: linear-gradient(135deg, #ff0033, #ff7700);
            top: -120px; left: -100px;
        }
        .orb-2 {
            width: 520px; height: 520px;
            background: linear-gradient(135deg, #ff0055, #9900ff);
            bottom: -150px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(30px) scale(1.1) rotate(5deg); }
        }

        .game-wrapper {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            z-index: 10;
            transform: scale(var(--scale-factor, 1));
            transform-origin: center center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 8, 12, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 0, 55, 0.45);
            border-radius: 16px;
            padding: 8px 22px;
            margin-bottom: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.75);
            letter-spacing: 1px;
        }

        .hud-stats {
            display: flex;
            gap: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            align-items: center;
        }

        #timerDisplay {
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.7);
            letter-spacing: 1px;
            font-weight: 900;
        }

        #gateWarningDisplay {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
            letter-spacing: 0.5px;
        }

        .level-tester-select {
            background: rgba(255, 0, 55, 0.22);
            border: 1.5px solid #ff0055;
            color: #ffea00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 55, 0.4);
        }

        .level-tester-select option {
            background: #1a0208;
            color: #ffea00;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arena-container {
            flex: 1;
            background: rgba(12, 3, 7, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 0, 55, 0.4);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85), inset 0 0 45px rgba(255, 0, 55, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        .distractor-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 55, 0.08) 0%, rgba(255, 120, 0, 0.05) 50%, transparent 80%),
                linear-gradient(rgba(255, 0, 55, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 55, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: pulseBg 7s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.65; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        #gameCanvas {
            width: 100%;
            height: 410px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            position: relative;
            bottom: 0;
            left: 0;
            width: 100%;
            margin-top: 4px;
            padding: 0 8px;
            pointer-events: auto;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .control-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }

        .control-group.right-group {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(35, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 0, 55, 0.35);
            border-bottom: 3px solid rgba(255, 0, 55, 0.65);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            width: 95px;
            height: 70px;
            font-size: 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            touch-action: manipulation;
            position: relative;
            transition: all 0.15s ease;
        }

        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: translateY(2px) scale(0.97);
            background: linear-gradient(135deg, rgba(255, 0, 55, 0.5), rgba(255, 102, 0, 0.5));
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 55, 0.7);
        }

        .btn-logo {
            font-size: 12px;
            font-weight: 900;
            color: #ff0055;
            margin-bottom: 2px;
            text-shadow: 0 0 6px rgba(255, 0, 85, 0.7);
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.5px;
        }

        .back-btn, .prev-lvl-btn, .next-lvl-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .prev-lvl-btn:hover, .next-lvl-btn:hover {
            color: #ff0055;
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        #notificationModal {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(30, 4, 8, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #ff0033;
            padding: 16px 30px;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.85), 0 0 25px rgba(255, 0, 55, 0.5);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notificationModal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="notificationModal">⏱️ TIME PENALTY BLAST!</div>

    <div class="game-wrapper" id="gameWrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">☠️ TIME TRIAL: LVL 71 ☠️</div>
            
            <div class="hud-stats">
                <select class="level-tester-select" id="levelPicker" onchange="jumpToDirectLevel(this.value)">
                </select>

                <span id="timerDisplay">TIME: 15.0s</span>
                <span id="gateWarningDisplay">GATE: SAFE</span>
            </div>

            <div class="hud-right-group">
                <button class="prev-lvl-btn" onclick="goToPrevLevel()">◀ BACK</button>
                <button class="next-lvl-btn" onclick="goToNextLevel()">NEXT ▶</button>
                <button class="back-btn" onclick="goHome()">QUIT</button>
            </div>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay" id="mobileControls">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtnM">◀</button>
                    <button class="ctrl-btn" id="rightBtnM">▶</button>
                </div>
                <div class="control-group right-group">
                    <button class="ctrl-btn" id="jumpBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DASH</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const picker = document.getElementById('levelPicker');
        for (let i = 71; i <= 100; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `LEVEL ${i}`;
            picker.appendChild(opt);
        }

        function handleScreenFit(e) {
            if (e.target.closest('button') || e.target.closest('.ctrl-btn') || e.target.closest('.game-hud') || e.target.closest('select')) return;
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.addEventListener('click', handleScreenFit);
        window.addEventListener('touchstart', handleScreenFit);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 1280;
        let canvasHeight = 410;

        function resizeCanvas() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            const scaleX = screenW / 1280;
            const scaleY = screenH / 720;
            const scale = Math.min(scaleX, scaleY) * 0.98;

            document.documentElement.style.setProperty('--scale-factor', scale);
            canvasWidth = 1280;
            canvasHeight = 410;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
        }

        const urlParams = new URLSearchParams(window.location.search);
        let requestedLvl = parseInt(urlParams.get('level')) || 71;
        if (requestedLvl < 71) requestedLvl = 71;
        if (requestedLvl > 100) requestedLvl = 100;

        let currentLevel = requestedLvl;
        let isExploding = false;
        let isRebuilding = false;
        let respawnAuraTimer = 0;
        let isSlowMo = false;
        let fragments = [];
        let particles = [];
        let floatingTexts = [];

        // TIME PRESSURE VARIABLES
        let levelTimeLeft = 15.0; // Seconds
        let idleTimer = 0; // Frames standing still
        let lastPlayerX = 40;
        let gatePanicMode = false;
        let gateTrapCountdown = 0; // Countdown when close to goal

        // Obstacles
        let timedTraps = [];
        let chaserTrolls = [];
        let collapsingFloors = [];
        let gateGuillotine = null;

        let player = {
            x: 40,
            y: 100,
            width: 13.0,     
            height: 40.5,    
            vx: 0,
            vy: 0,
            speed: 4.8,       
            jumpForce: -8.2,  
            gravity: 0.42,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let goal = { x: 0, y: 0, w: 42, h: 56 };

        const timeFailTaunts = [
            "Time ki ahmiyat samjho! 1 second late aur blast! ⏱️💥",
            "Gate ke samne sochte rahe? Troll ne uda diya! 🚪💀",
            "Sust dummy! 1 move late matlab instant explosion! 🐌🔥",
            "Speed up! Rukna mana tha! 🏃⚡",
            "Gate band hone ka intezaar kar rahe the kya? 🤡❌",
            "Time is life! Tik-tik ghadi ne maar giraya! ⏳☠️"
        ];

        function showTrollTaunt(customMsg) {
            let msg = customMsg || timeFailTaunts[Math.floor(Math.random() * timeFailTaunts.length)];
            const modal = document.getElementById('notificationModal');
            modal.innerText = msg;
            modal.classList.add('show');
            setTimeout(() => modal.classList.remove('show'), 1600);
        }

        function jumpToDirectLevel(lvl) {
            currentLevel = parseInt(lvl);
            updateGameLayout();
        }

        function updateGameLayout() {
            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;
            const diff = currentLevel - 71; // 0 to 29

            // Level Duration decreases as level increases (Strict Time Window)
            levelTimeLeft = Math.max(8.0, 15.0 - (diff * 0.22));
            idleTimer = 0;
            lastPlayerX = 40;
            gatePanicMode = false;
            gateTrapCountdown = 0;

            document.getElementById('levelTitle').innerText = `☠️ TIME PURSUIT: LVL ${currentLevel} ☠️`;
            document.getElementById('timerDisplay').innerText = `TIME: ${levelTimeLeft.toFixed(1)}s`;
            document.getElementById('gateWarningDisplay').innerText = "GATE: SAFE";
            document.getElementById('gateWarningDisplay').style.color = "#00ffcc";

            if (picker) picker.value = currentLevel;

            platforms = [];
            timedTraps = [];
            chaserTrolls = [];
            collapsingFloors = [];

            // Base Ground
            platforms.push({ x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' });

            // Strategic Platforms with Time-Collapse
            const numSegments = 3 + (currentLevel % 3);
            for (let i = 1; i <= numSegments; i++) {
                let px = 180 + i * 190;
                let py = surfaceTop - (50 + (i % 3) * 45);
                let pw = Math.max(70, 110 - diff * 1.2);
                platforms.push({ x: px, y: py, w: pw, h: 16, type: 'secondSurface' });

                // Step-decay collapsing platforms
                collapsingFloors.push({
                    x: px,
                    y: py,
                    w: pw,
                    h: 16,
                    life: 45 - Math.min(25, diff), // Frames before disappearing when touched
                    touched: false,
                    collapsed: false
                });
            }

            // High-Speed Relentless Chaser Trolls (Speed scales with level)
            const trollSpeed = 2.4 + (diff * 0.12);
            chaserTrolls.push({
                x: 0,
                y: surfaceTop - 36,
                w: 26,
                h: 32,
                vx: trollSpeed,
                color: '#ff0033'
            });

            if (currentLevel >= 80) {
                // Second aerial chaser from above
                chaserTrolls.push({
                    x: 200,
                    y: surfaceTop - 180,
                    w: 22,
                    h: 22,
                    vx: trollSpeed * 0.9,
                    color: '#ff7700',
                    flying: true
                });
            }

            // Gate Trap Guillotine (Crucial near-gate punishment)
            gateGuillotine = {
                x: canvasWidth - 110,
                y: 0,
                w: 24,
                h: 0,
                maxH: surfaceTop,
                dropping: false,
                dropSpeed: 9 + (diff * 0.3)
            };

            // Player reset
            player.x = 40;
            player.y = 100;
            player.vx = 0;
            player.vy = 0;

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - goal.w - 10;
        }

        function goToPrevLevel() {
            if (currentLevel > 71) {
                currentLevel--;
                updateGameLayout();
            } else {
                window.location.href = "./game3.html?level=70";
            }
        }

        function goToNextLevel() {
            if (currentLevel < 100) {
                currentLevel++;
                updateGameLayout();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        let keys = { left: false, right: false, down: false };
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(560, now + 0.14);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.14);
                } else if (type === 'blast') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(170, now);
                    osc.frequency.exponentialRampToValueAtTime(12, now + 0.5);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'tick') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'alarm') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(750, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'reboot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {}
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const handleStart = (e) => {
                if (e) e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                onStart();
            };
            const handleEnd = (e) => {
                if (e) e.preventDefault();
                btn.classList.remove('pressed');
                onEnd();
            };
            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('touchcancel', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        };

        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        function triggerJump() {
            if (player.isGrounded && !isExploding && !isRebuilding) {
                player.vy = player.jumpForce; 
                player.isGrounded = false;
                playSound('jump');
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: -Math.random() * 1.8,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(255, 0, 55, 0.8)',
                        life: 25
                    });
                }
            }
        }

        const jumpBtnM = document.getElementById('jumpBtnM');
        if (jumpBtnM) {
            jumpBtnM.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); }, { passive: false });
            jumpBtnM.addEventListener('mousedown', triggerJump);
        }

        // Quick Dash functionality on shield button to overcome tight time
        const dashBtn = document.getElementById('shieldBtnM');
        if (dashBtn) {
            dashBtn.addEventListener('click', () => {
                if (!isExploding && !isRebuilding) {
                    player.vx = (keys.left ? -8 : 8);
                    playSound('jump');
                    floatingTexts.push({ text: 'DASH! ⚡', x: player.x - 10, y: player.y - 20, alpha: 1, vy: -1 });
                }
            });
        }

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
        });

        function triggerExplosion(reason) {
            if (isExploding || isRebuilding) return;
            isExploding = true;
            isSlowMo = true;
            playSound('blast');
            showTrollTaunt(reason);

            fragments = [];
            const colors = ['#ff0033', '#ff7700', '#ffea00', '#ffffff', '#9900ff'];
            for (let i = 0; i < 34; i++) {
                fragments.push({
                    x: player.x + Math.random() * player.width,
                    y: player.y + Math.random() * player.height,
                    originX: 40 + player.width / 2,
                    originY: 100 + player.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.6) * 14,
                    color: colors[i % colors.length],
                    size: Math.random() * 4 + 2
                });
            }

            setTimeout(() => {
                isExploding = false;
                isRebuilding = true;
                playSound('reboot');

                setTimeout(() => {
                    isRebuilding = false;
                    isSlowMo = false;
                    respawnAuraTimer = 35;
                    updateGameLayout();
                }, 800);
            }, 850);
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.35 * timeFactor;
                });
                return;
            }

            if (isRebuilding) {
                fragments.forEach(f => {
                    f.x += (f.originX - f.x) * 0.18;
                    f.y += (f.originY - f.y) * 0.18;
                });
                return;
            }

            if (respawnAuraTimer > 0) respawnAuraTimer--;

            // ==========================================
            // ⏱️ TIME SYSTEM 1: GLOBAL LEVEL COUNTDOWN
            // ==========================================
            levelTimeLeft -= (1 / 60) * timeFactor;
            if (levelTimeLeft <= 0) {
                levelTimeLeft = 0;
                triggerExplosion("TIME'S UP! Har second keemat rakhta hai! ⏱️️💀");
                return;
            }
            document.getElementById('timerDisplay').innerText = `TIME: ${levelTimeLeft.toFixed(1)}s`;
            if (levelTimeLeft <= 3.5) {
                document.getElementById('timerDisplay').style.color = "#ff0033";
                if (Math.random() < 0.05) playSound('tick');
            } else {
                document.getElementById('timerDisplay').style.color = "#ffcc00";
            }

            // ==========================================
            // ⏱️ TIME SYSTEM 2: IDLE PENALTY (RUKNA MANA HAI)
            // ==========================================
            if (Math.abs(player.x - lastPlayerX) < 0.5) {
                idleTimer++;
                if (idleTimer > 80) { // ~1.3 seconds standing still
                    triggerExplosion("RUK GAYE? Time waste karne par instant blast! 🛑🔥");
                    return;
                }
            } else {
                idleTimer = 0;
                lastPlayerX = player.x;
            }

            // Controls
            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.18;
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.18;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (keys.down) player.height = 24.3;
            else player.height = 40.5;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;

            // Platform Collision & Collapse Timer
            platforms.forEach((p, idx) => {
                let cf = collapsingFloors[idx - 1]; // Offset by ground
                if (cf && cf.collapsed) return; // Floor disappeared

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;

                    if (cf) {
                        cf.touched = true;
                    }
                }
            });

            // Update Collapsing Floors
            collapsingFloors.forEach(cf => {
                if (cf.touched && !cf.collapsed) {
                    cf.life -= 1 * timeFactor;
                    if (cf.life <= 0) {
                        cf.collapsed = true;
                        floatingTexts.push({ text: 'STEP COLLAPSED! 💥', x: cf.x, y: cf.y - 15, alpha: 1, vy: -1 });
                    }
                }
            });

            // ==========================================
            // 🚪 TIME SYSTEM 3: GATE-PROXIMITY PANIC ATTACK
            // ==========================================
            // Jab dummy Gate se 160px ke daayre mein aata hai
            let distToGoal = goal.x - (player.x + player.width);
            if (distToGoal < 160 && !gatePanicMode) {
                gatePanicMode = true;
                gateTrapCountdown = 90; // Exactly 1.5 seconds to enter
                playSound('alarm');
                document.getElementById('gateWarningDisplay').innerText = "LOCKDOWN IN 1.5s!";
                document.getElementById('gateWarningDisplay').style.color = "#ff0033";
                floatingTexts.push({ text: 'GATE CLOSING! RUSH! 🚪⚠️️', x: goal.x - 70, y: goal.y - 25, alpha: 1, vy: -1 });
            }

            if (gatePanicMode) {
                gateTrapCountdown -= 1 * timeFactor;
                gateGuillotine.dropping = true;
                gateGuillotine.h += gateGuillotine.dropSpeed * timeFactor;

                // Agar gate ke aage late hue aur guillotine me fase
                if (
                    player.x + player.width > gateGuillotine.x &&
                    player.x < gateGuillotine.x + gateGuillotine.w &&
                    player.y < gateGuillotine.h
                ) {
                    triggerExplosion("GATE LOCKDOWN! Thoda jaldi aana tha! 🚪💀");
                    return;
                }

                if (gateTrapCountdown <= 0 && !levelWon) {
                    triggerExplosion("GATE SHUT! Entry window miss ho gayi! ⌛🔒");
                    return;
                }
            }

            // ==========================================
            // 🤖 RELENTLESS TIME-CHASER TROLLS
            // ==========================================
            chaserTrolls.forEach(tr => {
                // Homing towards dummy
                if (tr.x < player.x) tr.x += tr.vx * timeFactor;
                else tr.x -= tr.vx * timeFactor;

                if (tr.flying) {
                    if (tr.y < player.y) tr.y += 1.8 * timeFactor;
                    else tr.y -= 1.8 * timeFactor;
                }

                // Lethal Collision
                if (
                    player.x + player.width > tr.x &&
                    player.x < tr.x + tr.w &&
                    player.y + player.height > tr.y &&
                    player.y < tr.y + tr.h
                ) {
                    triggerExplosion("TROLL NE PAKAD LIYA! Time waste ki saza! ☠️🔥");
                }
            });

            if (player.y > canvasHeight + 100) triggerExplosion("FALL DEATH! Dhyaan kahan tha? 🕳️");

            // Gate Win Condition
            let gateInsideLeft = goal.x + 6;
            let gateInsideRight = goal.x + goal.w - 6;
            let isDummyCompletelyInsideGate = (player.x >= gateInsideLeft && (player.x + player.width) <= gateInsideRight);
            let isDummyTouchingGateVertically = (player.y + player.height >= goal.y && player.y <= goal.y + goal.h);

            if (isDummyTouchingGateVertically && (player.x + player.width >= goal.x && player.x <= goal.x + goal.w)) {
                if (!levelWon) {
                    if (isDummyCompletelyInsideGate) {
                        levelWon = true;
                        playSound('win');
                        const modal = document.getElementById('notificationModal');

                        if (currentLevel < 100) {
                            modal.innerText = `🎉 LEVEL ${currentLevel} CLEARED! TIMING PERFECT THA! ⏱️🤪`;
                            modal.classList.add('show');

                            let nextLvl = currentLevel + 1;
                            setTimeout(() => {
                                modal.classList.remove('show');
                                currentLevel = nextLvl;
                                levelWon = false;
                                updateGameLayout();
                            }, 1800);
                        } else {
                            modal.innerText = "👑 CONGRATULATIONS! ALL 100 LEVELS BEATEN! TIME GOD! 🏆";
                            modal.classList.add('show');
                            setTimeout(() => {
                                window.location.href = "index.html";
                            }, 2500);
                        }
                    } else {
                        if (Math.random() < 0.08) {
                            floatingTexts.push({ text: 'ENTER FULLY! TIME BHAG RAHA HAI! 🚪🏃', x: goal.x - 80, y: goal.y - 20, alpha: 1, vy: -0.5 });
                        }
                    }
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Platforms & Collapsing States
            platforms.forEach((p, idx) => {
                let cf = collapsingFloors[idx - 1];
                if (cf && cf.collapsed) return;

                ctx.fillStyle = (cf && cf.touched) ? '#ff3300' : '#14060c';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.strokeStyle = (cf && cf.touched) ? '#ffff00' : '#ff0055';
                ctx.lineWidth = 2;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Gate Trap Guillotine Wall
            if (gateGuillotine && gateGuillotine.h > 0) {
                ctx.save();
                ctx.fillStyle = '#ff0033';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 14;
                ctx.fillRect(gateGuillotine.x, gateGuillotine.y, gateGuillotine.w, gateGuillotine.h);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(gateGuillotine.x, gateGuillotine.y, gateGuillotine.w, gateGuillotine.h);
                ctx.restore();
            }

            // Chaser Trolls
            chaserTrolls.forEach(tr => {
                ctx.save();
                ctx.fillStyle = tr.color;
                ctx.shadowColor = tr.color;
                ctx.shadowBlur = 12;
                ctx.fillRect(tr.x, tr.y, tr.w, tr.h);

                // Evil Tracking Horns/Spikes
                ctx.fillStyle = '#ffea00';
                ctx.beginPath();
                ctx.moveTo(tr.x + 2, tr.y);
                ctx.lineTo(tr.x + tr.w / 2, tr.y - 8);
                ctx.lineTo(tr.x + tr.w - 2, tr.y);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(tr.x + 4, tr.y + 8, 4, 4);
                ctx.fillRect(tr.x + tr.w - 8, tr.y + 8, 4, 4);
                ctx.restore();
            });

            // Goal Gate
            let gx = goal.x, gy = goal.y, gw = goal.w, gh = goal.h;
            ctx.fillStyle = gatePanicMode ? 'rgba(255, 0, 55, 0.25)' : 'rgba(0, 255, 204, 0.15)';
            ctx.fillRect(gx - 4, gy - 4, gw + 8, gh + 8);
            ctx.fillStyle = '#051410';
            ctx.fillRect(gx, gy, gw, gh);

            let portalGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
            portalGrad.addColorStop(0, gatePanicMode ? '#ff0033' : '#00ffcc');
            portalGrad.addColorStop(1, '#ff7700');
            ctx.fillStyle = portalGrad;
            ctx.fillRect(gx + 4, gy + 4, gw - 8, gh - 4);

            ctx.strokeStyle = gatePanicMode ? '#ff0033' : '#00ffcc';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(gx, gy, gw, gh);

            // Explosion Animation
            if (isExploding || isRebuilding) {
                fragments.forEach(f => {
                    ctx.save();
                    ctx.fillStyle = f.color;
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(f.x, f.y, f.size, f.size);
                    if (isRebuilding) {
                        ctx.strokeStyle = 'rgba(255, 0, 85, 0.25)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(f.x, f.y);
                        ctx.lineTo(f.originX, f.originY);
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            } else {
                let px = player.x, py = player.y;

                if (respawnAuraTimer > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px + player.width / 2, py + player.height / 2, 38 - respawnAuraTimer, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 85, ${respawnAuraTimer / 35})`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                let legSwing = (player.vx !== 0 || !player.isGrounded) ? Math.sin(player.animTimer) * 4 : 0;
                let isJumpingOrAirborne = !player.isGrounded;
                let jumpStretch = isJumpingOrAirborne ? -2 : 0;

                let headRadius = 4.5;
                let headX = px + player.width/2;
                let headY = py + 5 + jumpStretch;

                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#ff9999');

                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                let torsoWidth = 6.3;
                let torsoX = px + (player.width - torsoWidth) / 2;
                let chestGrad = ctx.createLinearGradient(torsoX, py + 10 + jumpStretch, torsoX + torsoWidth, py + 10 + jumpStretch);
                chestGrad.addColorStop(0, '#ff0055');
                chestGrad.addColorStop(1, '#ff9900');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(torsoX, py + 10 + jumpStretch, torsoWidth, 13);

                ctx.fillStyle = '#ffea00';
                ctx.fillRect(torsoX - 1, py + 23 + jumpStretch, torsoWidth + 2, 2.2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX - 3.5, py + 12 + jumpStretch, 2.2, 10);
                ctx.fillRect(torsoX + torsoWidth + 0.8, py + 12 + jumpStretch, 2.2, 10);

                let legHeight = player.height === 24.3 ? 7 : 12;
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(torsoX + 0.8 + legSwing, py + 25.2 + jumpStretch, 2.2, legHeight);
                ctx.fillRect(torsoX + torsoWidth - 3 - legSwing, py + 25.2 + jumpStretch, 2.2, legHeight);
            }

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 12px Orbitron, sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 8;
                ctx.fillText(ft.text, ft.x - 8, ft.y);
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            loop();
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
