<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Chapter 3 (Levels 16-30)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020205;
            background: radial-gradient(circle at center, #16041a 0%, #08030f 70%, #020104 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.45;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 {
            width: 450px; height: 450px;
            background: linear-gradient(135deg, #ff0055, #7928ca);
            top: -120px; left: -100px;
        }
        .orb-2 {
            width: 520px; height: 520px;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            bottom: -150px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(30px) scale(1.1) rotate(5deg); }
        }

        .game-wrapper {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            z-index: 10;
            transform: scale(var(--scale-factor, 1));
            transform-origin: center center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 10, 26, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 85, 0.35);
            border-radius: 16px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ff007f;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
            letter-spacing: 1px;
        }

        .hud-stats {
            display: flex;
            gap: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            align-items: center;
        }

        #threatDisplay {
            color: #ff3366;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
            letter-spacing: 0.5px;
        }

        #shieldDisplay {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
            letter-spacing: 0.5px;
        }

        .level-tester-select {
            background: rgba(255, 0, 127, 0.22);
            border: 1.5px solid #ff007f;
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        .level-tester-select option {
            background: #120419;
            color: #00f0ff;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arena-container {
            flex: 1;
            background: rgba(10, 6, 16, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 0, 85, 0.3);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(255, 0, 85, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        .distractor-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.08) 0%, rgba(0, 240, 255, 0.04) 50%, transparent 80%),
                linear-gradient(rgba(255, 0, 85, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: pulseBg 7s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.65; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        #gameCanvas {
            width: 100%;
            height: 410px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            position: relative;
            bottom: 0;
            left: 0;
            width: 100%;
            margin-top: 4px;
            padding: 0 8px;
            pointer-events: auto;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .control-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }

        .control-group.right-group {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(28, 14, 32, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 0, 85, 0.3);
            border-bottom: 3px solid rgba(255, 0, 85, 0.55);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            width: 95px;
            height: 70px;
            font-size: 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            touch-action: manipulation;
            position: relative;
            transition: all 0.15s ease;
        }

        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: translateY(2px) scale(0.97);
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.45), rgba(121, 40, 202, 0.45));
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .btn-logo {
            font-size: 12px;
            font-weight: 900;
            color: #ff007f;
            margin-bottom: 2px;
            text-shadow: 0 0 6px rgba(255, 0, 127, 0.7);
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.5px;
        }

        .back-btn, .prev-lvl-btn, .next-lvl-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .prev-lvl-btn:hover, .next-lvl-btn:hover {
            color: #ff007f;
            border-color: #ff007f;
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        #notificationModal {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20, 8, 25, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #ff0055;
            padding: 16px 30px;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(255, 0, 85, 0.4);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notificationModal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="notificationModal">⚠️ LEVEL SELECTED!</div>

    <div class="game-wrapper" id="gameWrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">☠️ BULLET HELL: LVL 16 ☠️</div>
            
            <div class="hud-stats">
                <select class="level-tester-select" id="levelPicker" onchange="jumpToDirectLevel(this.value)">
                    <option value="16">TEST LVL 16</option>
                    <option value="17">TEST LVL 17</option>
                    <option value="18">TEST LVL 18</option>
                    <option value="19">TEST LVL 19</option>
                    <option value="20">TEST LVL 20</option>
                    <option value="21">TEST LVL 21</option>
                    <option value="22">TEST LVL 22</option>
                    <option value="23">TEST LVL 23</option>
                    <option value="24">TEST LVL 24</option>
                    <option value="25">TEST LVL 25</option>
                    <option value="26">TEST LVL 26</option>
                    <option value="27">TEST LVL 27</option>
                    <option value="28">TEST LVL 28</option>
                    <option value="29">TEST LVL 29</option>
                    <option value="30">TEST LVL 30</option>
                </select>

                <span id="threatDisplay">ATTACK: 4-WAY</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>

            <div class="hud-right-group">
                <button class="prev-lvl-btn" onclick="goToPrevLevel()">◀ BACK</button>
                <button class="next-lvl-btn" onclick="goToNextLevel()">NEXT ▶</button>
                <button class="back-btn" onclick="goHome()">QUIT</button>
            </div>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay" id="mobileControls">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtnM">◀</button>
                    <button class="ctrl-btn" id="rightBtnM">▶</button>
                </div>
                <div class="control-group right-group">
                    <button class="ctrl-btn" id="jumpBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleScreenFit(e) {
            if (e.target.closest('button') || e.target.closest('.ctrl-btn') || e.target.closest('.game-hud') || e.target.closest('select')) return;
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.addEventListener('click', handleScreenFit);
        window.addEventListener('touchstart', handleScreenFit);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 1280;
        let canvasHeight = 410;

        function resizeCanvas() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            const scaleX = screenW / 1280;
            const scaleY = screenH / 720;
            const scale = Math.min(scaleX, scaleY) * 0.98;

            document.documentElement.style.setProperty('--scale-factor', scale);
            canvasWidth = 1280;
            canvasHeight = 410;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
        }

        // Default Level 16 set kiya gaya hai
        let currentLevel = 16;
        let shieldActive = false;
        let isExploding = false;
        let isRebuilding = false;
        let respawnAuraTimer = 0;
        let isSlowMo = false;
        let fragments = [];
        let particles = [];
        let floatingTexts = [];

        let projectiles = [];
        let globalTick = 0;

        let player = {
            x: 40,
            y: 100,
            width: 13.0,     
            height: 40.5,    
            vx: 0,
            vy: 0,
            speed: 4.6,       
            jumpForce: -8.0,  
            gravity: 0.40,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let goal = { x: 0, y: 0, w: 40, h: 54 };

        const attackTaunts = [
            "Chaaron taraf se gher liya na? 💀💥",
            "Upar se gira, aage laser ne uda diya! ⚡🤣",
            "Peeche dekhne ka time nahi mila? 🚀🔥",
            "Ground ke flames me roast ho gaye! 🩸",
            "Reflex slow hai, 4-way assault jhel nahi paaye! 🤡",
            "Shield on karne ka mauka bhi nahi diya! 🛡️❌"
        ];

        function showTrollTaunt(customMsg) {
            let msg = customMsg || attackTaunts[Math.floor(Math.random() * attackTaunts.length)];
            const modal = document.getElementById('notificationModal');
            modal.innerText = msg;
            modal.classList.add('show');
            setTimeout(() => modal.classList.remove('show'), 1500);
        }

        function jumpToDirectLevel(lvl) {
            currentLevel = parseInt(lvl);
            updateGameLayout();
        }

        function updateGameLayout() {
            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;

            const levelNames = {
                16: "🚀『 FRONT & BACK MISSILE STREAM 』- Lvl 16",
                17: "🌧️『 CEILING METEORITE RAIN 』- Lvl 17",
                18: "🔥『 GROUND HYDRAULIC FLAME VENTS 』- Lvl 18",
                19: "⚡『 CROSSFIRE: UP & DOWN VOLTAGE 』- Lvl 19",
                20: "☠️『 TRIPLE ANGLE DEATH TRAP 』- Lvl 20",
                21: "🌪️『 FULL QUAD-DIRECTIONAL BARRAGE 』- Lvl 21",
                22: "🛰️『 HOMING PLASMA SEEKERS 』- Lvl 22",
                23: "⚙️『 ALTERNATING HORIZONTAL LASERS 』- Lvl 23",
                24: "🔨『 ANVIL SMASH & FLOOR NEEDLES 』- Lvl 24",
                25: "🚨『 DUAL HORIZON FLAME WALLS 』- Lvl 25",
                26: "🛸『 ORBITAL CROSS BEAM BOMBARDMENT 』- Lvl 26",
                27: "💣『 ZERO ESCAPE: CHAOS BULLET HELL 』- Lvl 27",
                28: "⚡『 4-WAY STROBE LASER MAZE 』- Lvl 28",
                29: "🔥『 HYPER VELOCITY INFERNO SHOWER 』- Lvl 29",
                30: "👑『 THE FINAL OMNIDIRECTIONAL HELL 』- Lvl 30"
            };

            document.getElementById('levelTitle').innerText = levelNames[currentLevel] || `⚡ LEVEL ${currentLevel} ⚡`;
            document.getElementById('threatDisplay').innerText = `ATTACK: ${Math.min(4, Math.floor((currentLevel-16)/3.5) + 2)}-WAY`;

            const picker = document.getElementById('levelPicker');
            if (picker) picker.value = currentLevel;

            platforms = [];
            projectiles = [];

            // Main Floor
            platforms.push({ x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' });

            if (currentLevel >= 17) {
                platforms.push({ x: 300, y: surfaceTop - 65, w: 90, h: 16, type: 'secondSurface' });
                platforms.push({ x: 650, y: surfaceTop - 75, w: 90, h: 16, type: 'secondSurface' });
            }
            if (currentLevel >= 22) {
                platforms.push({ x: 480, y: surfaceTop - 110, w: 80, h: 16, type: 'secondSurface' });
                platforms.push({ x: 860, y: surfaceTop - 65, w: 90, h: 16, type: 'secondSurface' });
            }

            player.x = 40;
            player.y = 100;
            player.vx = 0;
            player.vy = 0;

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - goal.w - 8;
        }

        function goToPrevLevel() {
            if (currentLevel > 16) {
                currentLevel--;
                updateGameLayout();
            } else {
                window.location.href = "./game.html";
            }
        }

        function goToNextLevel() {
            if (currentLevel < 30) {
                currentLevel++;
                updateGameLayout();
            }
        }

        let keys = { left: false, right: false, down: false };
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(540, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'blast') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.5);
                    gain.gain.setValueAtTime(0.65, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'reboot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(920, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {}
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const handleStart = (e) => {
                if (e) e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                onStart();
            };
            const handleEnd = (e) => {
                if (e) e.preventDefault();
                btn.classList.remove('pressed');
                onEnd();
            };
            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('touchcancel', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        };

        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        function triggerJump() {
            if (player.isGrounded && !isExploding && !isRebuilding) {
                player.vy = player.jumpForce; 
                player.isGrounded = false;
                playSound('jump');
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: -Math.random() * 1.8,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(255, 0, 127, 0.8)',
                        life: 25
                    });
                }
            }
        }

        const jumpBtnM = document.getElementById('jumpBtnM');
        if (jumpBtnM) {
            jumpBtnM.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); }, { passive: false });
            jumpBtnM.addEventListener('mousedown', triggerJump);
        }

        const shieldBtnM = document.getElementById('shieldBtnM');
        if (shieldBtnM) {
            const activateShield = (e) => {
                if (e) e.preventDefault();
                initAudio();
                shieldBtnM.classList.add('pressed');
                shieldActive = true;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: ON";
                el.style.color = "#ff007f";
                el.style.textShadow = "0 0 10px rgba(255, 0, 127, 0.8)";
            };
            const deactivateShield = (e) => {
                if (e) e.preventDefault();
                shieldBtnM.classList.remove('pressed');
                shieldActive = false;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: OFF";
                el.style.color = "#00ffcc";
                el.style.textShadow = "0 0 8px rgba(0, 255, 204, 0.4)";
            };
            shieldBtnM.addEventListener('touchstart', activateShield, { passive: false });
            shieldBtnM.addEventListener('touchend', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('mousedown', activateShield);
            shieldBtnM.addEventListener('mouseup', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'Shift') {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ff007f";
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'Shift') {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#00ffcc";
            }
        });

        function triggerExplosion() {
            if (isExploding || isRebuilding) return;
            isExploding = true;
            isSlowMo = true;
            playSound('blast');
            showTrollTaunt();

            fragments = [];
            const colors = ['#ff0055', '#ff007f', '#00f0ff', '#ffffff', '#7928ca'];
            for (let i = 0; i < 32; i++) {
                fragments.push({
                    x: player.x + Math.random() * player.width,
                    y: player.y + Math.random() * player.height,
                    originX: 40 + player.width / 2,
                    originY: 100 + player.height / 2,
                    vx: (Math.random() - 0.5) * 13,
                    vy: (Math.random() - 0.6) * 13,
                    color: colors[i % colors.length],
                    size: Math.random() * 4 + 2
                });
            }

            setTimeout(() => {
                isExploding = false;
                isRebuilding = true;
                playSound('reboot');

                setTimeout(() => {
                    isRebuilding = false;
                    isSlowMo = false;
                    respawnAuraTimer = 35;
                    updateGameLayout();
                }, 800);
            }, 850);
        }

        function spawnProjectiles() {
            const surfaceTop = canvasHeight - 40;
            const diffScale = (currentLevel - 16); 

            // Front Attack (Right to Left)
            if (globalTick % Math.max(25, 65 - diffScale * 3) === 0) {
                projectiles.push({
                    type: 'horizontal',
                    dir: 'left',
                    x: canvasWidth,
                    y: surfaceTop - 15 - Math.random() * 85,
                    vx: -(5.5 + diffScale * 0.35),
                    vy: 0,
                    w: 22,
                    h: 6,
                    color: '#ff0055'
                });
            }

            // Back Attack (Left to Right)
            if (globalTick % Math.max(35, 80 - diffScale * 3) === 0) {
                projectiles.push({
                    type: 'horizontal',
                    dir: 'right',
                    x: -20,
                    y: surfaceTop - 20 - Math.random() * 80,
                    vx: 5.0 + diffScale * 0.3,
                    vy: 0,
                    w: 20,
                    h: 6,
                    color: '#ff3366'
                });
            }

            // Top Attack (Ceiling Drop)
            if (currentLevel >= 17 && globalTick % Math.max(20, 55 - diffScale * 2.5) === 0) {
                let targetX = (Math.random() < 0.6) ? player.x + (Math.random() - 0.5) * 80 : Math.random() * canvasWidth;
                projectiles.push({
                    type: 'vertical_down',
                    dir: 'down',
                    x: Math.max(10, Math.min(canvasWidth - 30, targetX)),
                    y: -20,
                    vx: 0,
                    vy: 5.0 + diffScale * 0.35,
                    w: 8,
                    h: 24,
                    color: '#00f0ff'
                });
            }

            // Bottom Attack (Floor Eruption)
            if (currentLevel >= 18 && globalTick % Math.max(30, 70 - diffScale * 2.8) === 0) {
                let eruptX = 200 + Math.random() * (canvasWidth - 350);
                projectiles.push({
                    type: 'vertical_up',
                    dir: 'up',
                    x: eruptX,
                    y: surfaceTop,
                    vx: 0,
                    vy: -(5.5 + diffScale * 0.3),
                    w: 12,
                    h: 22,
                    color: '#ffaa00'
                });
            }
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;
            globalTick++;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.35 * timeFactor;
                });
                return;
            }

            if (isRebuilding) {
                fragments.forEach(f => {
                    f.x += (f.originX - f.x) * 0.18;
                    f.y += (f.originY - f.y) * 0.18;
                });
                return;
            }

            if (respawnAuraTimer > 0) respawnAuraTimer--;

            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.18;
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.18;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (keys.down) player.height = 24.3;
            else player.height = 40.5;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;

            // Platform Collision
            platforms.forEach(p => {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            spawnProjectiles();

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let pr = projectiles[i];
                pr.x += pr.vx * timeFactor;
                pr.y += pr.vy * timeFactor;

                if (pr.x < -40 || pr.x > canvasWidth + 40 || pr.y < -40 || pr.y > canvasHeight + 40) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let hitBoxMargin = shieldActive ? -4 : 2;
                if (
                    player.x + player.width - hitBoxMargin > pr.x &&
                    player.x + hitBoxMargin < pr.x + pr.w &&
                    player.y + player.height - hitBoxMargin > pr.y &&
                    player.y + hitBoxMargin < pr.y + pr.h
                ) {
                    projectiles.splice(i, 1);
                    if (shieldActive) {
                        floatingTexts.push({ text: 'DEFLECTED! 🛡️', x: player.x - 25, y: player.y - 20, alpha: 1, vy: -1 });
                        playSound('jump');
                    } else {
                        triggerExplosion();
                        break;
                    }
                }
            }

            if (player.y > canvasHeight + 100) triggerExplosion();

            // Full Body Gate Check
            let gateInsideLeft = goal.x + 6;
            let gateInsideRight = goal.x + goal.w - 6;
            let isDummyCompletelyInsideGate = (player.x >= gateInsideLeft && (player.x + player.width) <= gateInsideRight);
            let isDummyTouchingGateVertically = (player.y + player.height >= goal.y && player.y <= goal.y + goal.h);

            if (isDummyTouchingGateVertically && (player.x + player.width >= goal.x && player.x <= goal.x + goal.w)) {
                if (!levelWon) {
                    if (isDummyCompletelyInsideGate) {
                        levelWon = true;
                        playSound('win');
                        const modal = document.getElementById('notificationModal');

                        if (currentLevel < 30) {
                            modal.innerText = `🎉 LEVEL ${currentLevel} CLEARED! NEXT TEST READY! 🤪`;
                            modal.classList.add('show');

                            let nextLvl = currentLevel + 1;
                            setTimeout(() => {
                                modal.classList.remove('show');
                                currentLevel = nextLvl;
                                levelWon = false;
                                updateGameLayout();
                            }, 1800);
                        } else {
                            modal.innerText = "👑 CONGRATULATIONS! ALL 30 LEVELS CONQUERED! 🏆";
                            modal.classList.add('show');
                            setTimeout(() => {
                                window.location.href = "index.html";
                            }, 2500);
                        }
                    } else {
                        if (Math.random() < 0.08) {
                            floatingTexts.push({ text: 'DODGE INSIDE THE GATE! 🚪🏃', x: goal.x - 80, y: goal.y - 20, alpha: 1, vy: -0.5 });
                        }
                    }
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Platforms
            platforms.forEach(p => {
                ctx.fillStyle = '#0f0817';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.strokeStyle = '#ff007f';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Projectiles
            projectiles.forEach(pr => {
                ctx.save();
                ctx.fillStyle = pr.color;
                ctx.shadowColor = pr.color;
                ctx.shadowBlur = 12;

                if (pr.type === 'horizontal') {
                    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(pr.dir === 'left' ? pr.x : pr.x + pr.w - 6, pr.y + 1, 6, pr.h - 2);
                } else if (pr.type === 'vertical_down') {
                    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(pr.x + 1, pr.y + pr.h - 6, pr.w - 2, 6);
                } else if (pr.type === 'vertical_up') {
                    ctx.beginPath();
                    ctx.moveTo(pr.x, pr.y + pr.h);
                    ctx.lineTo(pr.x + pr.w / 2, pr.y);
                    ctx.lineTo(pr.x + pr.w, pr.y + pr.h);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            });

            // Gate
            let gx = goal.x, gy = goal.y, gw = goal.w, gh = goal.h;
            ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
            ctx.fillRect(gx - 4, gy - 4, gw + 8, gh + 8);
            ctx.fillStyle = '#031c19';
            ctx.fillRect(gx, gy, gw, gh);

            let portalGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
            portalGrad.addColorStop(0, '#00ffcc');
            portalGrad.addColorStop(0.5, '#0072ff');
            portalGrad.addColorStop(1, '#ff007f');
            ctx.fillStyle = portalGrad;
            ctx.fillRect(gx + 4, gy + 4, gw - 8, gh - 4);

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(gx, gy, gw, gh);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(gx + gw / 2 - 1, gy + 8, 2, gh - 16);

            // Explosion Rebuild Animation
            if (isExploding || isRebuilding) {
                fragments.forEach(f => {
                    ctx.save();
                    ctx.fillStyle = f.color;
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(f.x, f.y, f.size, f.size);
                    if (isRebuilding) {
                        ctx.strokeStyle = 'rgba(255, 0, 127, 0.25)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(f.x, f.y);
                        ctx.lineTo(f.originX, f.originY);
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            } else {
                let px = player.x, py = player.y;

                if (respawnAuraTimer > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px + player.width / 2, py + player.height / 2, 38 - respawnAuraTimer, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 0, 127, ${respawnAuraTimer / 35})`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();
                }

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + player.width/2, py + player.height/2, 23, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 0, 127, 0.25)';
                    ctx.fill();
                    ctx.strokeStyle = '#ff007f';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 14;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                let legSwing = (player.vx !== 0 || !player.isGrounded) ? Math.sin(player.animTimer) * 4 : 0;
                let isJumpingOrAirborne = !player.isGrounded;
                let jumpStretch = isJumpingOrAirborne ? -2 : 0;

                let headRadius = 4.5;
                let headX = px + player.width/2;
                let headY = py + 5 + jumpStretch;

                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#a0c4ff');

                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                let torsoWidth = 6.3;
                let torsoX = px + (player.width - torsoWidth) / 2;
                let chestGrad = ctx.createLinearGradient(torsoX, py + 10 + jumpStretch, torsoX + torsoWidth, py + 10 + jumpStretch);
                chestGrad.addColorStop(0, '#00f0ff');
                chestGrad.addColorStop(1, '#ff007f');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(torsoX, py + 10 + jumpStretch, torsoWidth, 13);

                ctx.fillStyle = '#ff0055';
                ctx.fillRect(torsoX - 1, py + 23 + jumpStretch, torsoWidth + 2, 2.2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX - 3.5, py + 12 + jumpStretch, 2.2, 10);
                ctx.fillRect(torsoX + torsoWidth + 0.8, py + 12 + jumpStretch, 2.2, 10);

                let legHeight = player.height === 24.3 ? 7 : 12;
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(torsoX + 0.8 + legSwing, py + 25.2 + jumpStretch, 2.2, legHeight);
                ctx.fillRect(torsoX + torsoWidth - 3 - legSwing, py + 25.2 + jumpStretch, 2.2, legHeight);
            }

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 12px Orbitron, sans-serif';
                ctx.fillStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 8;
                ctx.fillText(ft.text, ft.x - 8, ft.y);
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Window Load par Force Setup
        window.addEventListener('load', () => {
            resizeCanvas();
            loop();
        });

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
