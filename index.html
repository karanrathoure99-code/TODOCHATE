<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web - iOS Glassmorphism Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          },
          colors: {
            wa: {
              teal: '#075E54',
              tealLight: '#128C7E',
              green: '#25D366',
              greenDark: '#1fa855',
              iosGreen: '#34C759',
              bubbleOut: '#d9fdd3',
              bubbleIn: '#ffffff',
              sidebar: '#ffffff',
              chatBg: '#efeae2',
            }
          },
          boxShadow: {
            'ios-glass': '0 20px 60px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4)',
            'ios-glow': '0 0 35px -5px rgba(37, 211, 102, 0.55)',
            'ios-glow-blue': '0 0 30px -5px rgba(59, 130, 246, 0.45)',
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Aurora Ambient Animated Mesh Background */
    .ios-aurora {
      background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.45) 0%, transparent 40%),
                  radial-gradient(circle at 90% 15%, rgba(6, 182, 212, 0.4) 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, rgba(99, 102, 241, 0.35) 0%, transparent 55%),
                  radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.3) 0%, transparent 40%),
                  #071a17;
      background-size: 170% 170%;
      animation: auroraShift 16s ease-in-out infinite alternate;
    }

    @keyframes auroraShift {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 30% 15%; }
    }

    /* Transparent Liquid Glass Card */
    .ios-glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(28px) saturate(210%);
      -webkit-backdrop-filter: blur(28px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.26);
    }

    .ios-glass-input {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.20);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ios-glass-input:focus-within {
      background: rgba(255, 255, 255, 0.20);
      border-color: rgba(52, 199, 89, 0.85);
      box-shadow: 0 0 20px rgba(52, 199, 89, 0.35);
    }

    /* iOS Toggle Switch */
    .ios-switch-input:checked + .ios-switch-slider {
      background-color: #34C759;
    }
    .ios-switch-input:checked + .ios-switch-slider .ios-switch-knob {
      transform: translateX(18px);
    }

    /* WhatsApp chat doodle wallpaper pattern */
    .wa-doodle-bg {
      background-color: #efeae2;
      background-image: 
        radial-gradient(#cfd5d9 1px, transparent 1px),
        radial-gradient(#cfd5d9 1px, #efeae2 1px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased font-sans select-none overflow-hidden h-screen w-screen flex flex-col justify-center items-center">

  <!-- ============================================== -->
  <!-- 1. LIQUID GLASS IOS LOGIN SCREEN (DEFAULT VIEW)-->
  <!-- ============================================== -->
  <section id="loginView" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 ios-aurora overflow-y-auto transition-all duration-700">
    
    <!-- Ambient Floating Light Orbs -->
    <div class="absolute -top-12 -left-12 w-80 h-80 rounded-full bg-emerald-400/25 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -right-12 w-96 h-96 rounded-full bg-cyan-400/20 blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/3 w-64 h-64 rounded-full bg-emerald-500/15 blur-2xl pointer-events-none"></div>

    <!-- Centered Glass Card -->
    <div class="relative w-full max-w-[430px] ios-glass-panel rounded-[36px] p-7 sm:p-9 text-white shadow-ios-glass z-10 transition-all duration-500 my-auto">
      
      <!-- Card Header: Glowing WhatsApp Icon & Title -->
      <div class="flex flex-col items-center text-center mb-7">
        <div class="relative mb-3 group cursor-pointer">
          <div class="absolute inset-0 rounded-2xl bg-wa-green/60 blur-xl group-hover:blur-2xl transition duration-500"></div>
          <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-wa-green p-[1.5px] shadow-ios-glow flex items-center justify-center">
            <div class="w-full h-full bg-black/40 backdrop-blur-xl rounded-2xl flex items-center justify-center">
              <i data-lucide="message-circle" class="w-9 h-9 text-white"></i>
            </div>
          </div>
        </div>

        <h1 class="text-2xl font-bold tracking-tight text-white mb-1">WhatsApp Web</h1>
        <p class="text-xs font-medium text-emerald-200/80">iOS Liquid Glass Edition • End-to-End Encrypted</p>
      </div>

      <!-- Quick Demo Login Button -->
      <div class="mb-5">
        <button type="button" onclick="fillDemoCredentials()" class="w-full py-2 px-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium text-emerald-100 flex items-center justify-center gap-2 transition duration-200 active:scale-98">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-yellow-300"></i>
          <span>Auto-fill Demo Gmail & Password</span>
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        
        <!-- Gmail Field -->
        <div>
          <label class="block text-xs font-medium text-gray-200 mb-1.5 ml-1">Gmail Address</label>
          <div class="ios-glass-input rounded-2xl px-3.5 py-3 flex items-center gap-3">
            <i data-lucide="mail" class="w-4 h-4 text-emerald-200/70"></i>
            <input 
              type="email" 
              id="emailInput" 
              required 
              placeholder="alex.miller@gmail.com" 
              autocomplete="email"
              class="bg-transparent text-sm w-full text-white placeholder-white/40 focus:outline-none"
            >
          </div>
        </div>

        <!-- Password Field with Visibility Toggle -->
        <div>
          <label class="block text-xs font-medium text-gray-200 mb-1.5 ml-1">Password</label>
          <div class="ios-glass-input rounded-2xl px-3.5 py-3 flex items-center gap-3 relative">
            <i data-lucide="lock" class="w-4 h-4 text-emerald-200/70"></i>
            <input 
              type="password" 
              id="passwordInput" 
              required 
              placeholder="••••••••••••" 
              autocomplete="current-password"
              class="bg-transparent text-sm w-full text-white placeholder-white/40 focus:outline-none pr-8"
            >
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute right-3.5 text-white/60 hover:text-white transition focus:outline-none"
              title="Toggle password view"
            >
              <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Toggle & Forgot Password -->
        <div class="flex items-center justify-between pt-1 pb-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <div class="relative">
              <input type="checkbox" id="rememberMe" checked class="sr-only ios-switch-input">
              <div class="ios-switch-slider w-10 h-5 bg-white/20 rounded-full transition-colors duration-300 p-0.5">
                <div class="ios-switch-knob w-4 h-4 bg-white rounded-full transition-transform duration-300 shadow-sm"></div>
              </div>
            </div>
            <span class="text-xs text-gray-200 font-medium">Remember me</span>
          </label>

          <a href="#" onclick="showQuickAlert('Password reset link will be sent to your Gmail.'); return false;" class="text-xs text-emerald-300 hover:text-emerald-200 transition">
            Forgot Password?
          </a>
        </div>

        <!-- iOS Glass Sign In Button -->
        <button 
          type="submit" 
          id="signInBtn"
          class="w-full mt-3 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-wa-green to-emerald-500 hover:from-wa-greenDark hover:to-emerald-600 text-slate-950 font-semibold text-sm shadow-ios-glow transition duration-300 transform active:scale-[0.98] flex items-center justify-center gap-2"
        >
          <span id="btnText">Sign In to WhatsApp</span>
          <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
        </button>

        <!-- Divider -->
        <div class="flex items-center my-3 text-white/30 text-xs">
          <div class="flex-1 border-t border-white/15"></div>
          <span class="px-3 uppercase tracking-wider text-[10px]">or</span>
          <div class="flex-1 border-t border-white/15"></div>
        </div>

        <!-- Google One-Click Button -->
        <button 
          type="button" 
          onclick="fillDemoCredentials(); handleLoginSubmit(event);" 
          class="w-full py-2.5 px-4 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium text-white transition flex items-center justify-center gap-2.5 active:scale-98"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.5 0 2.8.5 3.9 1.4l2.9-2.9C17 1.8 14.6 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
            <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.1 0 12s.6 3.7 1.6 5.6l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

      </form>

      <!-- Security Trust Footer -->
      <div class="mt-6 pt-4 border-t border-white/10 flex items-center justify-center gap-1.5 text-[11px] text-white/60">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-300"></i>
        <span>Secured with iOS KeyChain & 256-bit AES</span>
      </div>

    </div>
  </section>

  <!-- ============================================== -->
  <!-- 2. WHATSAPP WEB APPLICATION INTERFACE          -->
  <!-- ============================================== -->
  <main id="appView" class="hidden w-full h-full max-w-[1700px] bg-white flex overflow-hidden shadow-2xl relative">
    
    <!-- LEFT SIDEBAR: User Info, Search & Chat List -->
    <aside class="w-full md:w-[380px] lg:w-[420px] flex-shrink-0 flex flex-col border-r border-gray-200 bg-white z-20">
      
      <!-- Sidebar Header (Logged In User Details) -->
      <div class="h-16 px-4 bg-[#f0f2f5] border-b border-gray-200 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer">
          <div class="relative">
            <img id="userAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-gray-300">
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-wa-green border-2 border-white rounded-full"></span>
          </div>
          <div class="leading-tight">
            <h2 id="userNameDisplay" class="font-semibold text-sm text-gray-900 truncate max-w-[130px]">Alex Miller</h2>
            <p id="userEmailDisplay" class="text-[11px] text-gray-500 truncate max-w-[130px]">alex.miller@gmail.com</p>
          </div>
        </div>

        <!-- Quick Action Buttons -->
        <div class="flex items-center gap-1 text-gray-600">
          <button title="Status" onclick="showQuickAlert('Stories & Status feature is synced.')" class="p-2 hover:bg-gray-200 rounded-full transition">
            <i data-lucide="circle-dashed" class="w-5 h-5"></i>
          </button>
          <button title="New Chat" onclick="showQuickAlert('Select any contact from the active list below to chat or call.')" class="p-2 hover:bg-gray-200 rounded-full transition">
            <i data-lucide="message-square-plus" class="w-5 h-5"></i>
          </button>
          <button title="Logout" onclick="handleLogout()" class="p-2 hover:bg-red-50 text-red-500 rounded-full transition" title="Log out to iOS Glass">
            <i data-lucide="log-out" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Search Input Box -->
      <div class="p-2.5 bg-white border-b border-gray-100">
        <div class="flex items-center bg-[#f0f2f5] rounded-lg px-3 py-1.5 focus-within:bg-white focus-within:ring-1 focus-within:ring-wa-green transition">
          <i data-lucide="search" class="w-4 h-4 text-gray-500 mr-3"></i>
          <input 
            type="text" 
            id="chatSearchInput" 
            oninput="handleSearchContact(event)" 
            placeholder="Search or start a new chat" 
            class="bg-transparent text-sm w-full text-gray-800 placeholder-gray-500 focus:outline-none"
          >
        </div>
      </div>

      <!-- Chats List -->
      <div id="chatsListContainer" class="flex-1 overflow-y-auto divide-y divide-gray-100">
        <!-- Rendered via JS -->
      </div>
    </aside>

    <!-- RIGHT SECTION: Active Conversation & Calling Screen -->
    <section class="hidden md:flex flex-1 flex-col h-full bg-[#efeae2] relative overflow-hidden">
      
      <!-- Top Chat Header -->
      <div class="h-16 px-4 bg-[#f0f2f5] border-b border-gray-200 flex items-center justify-between z-10">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="activeContactAvatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=faces" class="w-10 h-10 rounded-full object-cover">
          <div>
            <h3 id="activeContactName" class="font-semibold text-sm text-gray-900">Sarah Jenkins</h3>
            <p id="activeContactStatus" class="text-xs text-gray-500">online</p>
          </div>
        </div>

        <!-- Chat Header Actions (Voice Call, Video Call, Search, Menu) -->
        <div class="flex items-center gap-1 text-gray-600">
          <button onclick="startCall('video')" title="Start Video Call" class="p-2.5 hover:bg-gray-200 rounded-full transition text-[#00a884] hover:text-[#008f6f]">
            <i data-lucide="video" class="w-5 h-5"></i>
          </button>
          <button onclick="startCall('audio')" title="Start Voice Call" class="p-2.5 hover:bg-gray-200 rounded-full transition text-[#00a884] hover:text-[#008f6f]">
            <i data-lucide="phone" class="w-5 h-5"></i>
          </button>
          <div class="h-5 w-[1px] bg-gray-300 mx-1"></div>
          <button title="Search in chat" onclick="showQuickAlert('Search inside this conversation')" class="p-2 hover:bg-gray-200 rounded-full transition">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button title="More options" onclick="showQuickAlert('WhatsApp options: View contact, clear chat, mute notifications')" class="p-2 hover:bg-gray-200 rounded-full transition">
            <i data-lucide="more-vertical" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Messages Viewport (WhatsApp Wallpaper background) -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 wa-doodle-bg flex flex-col justify-start">
        <!-- Rendered via JS -->
      </div>

      <!-- Bottom Chat Input Bar -->
      <div class="p-2.5 bg-[#f0f2f5] border-t border-gray-200 flex items-center gap-2 z-10">
        <button title="Emoji Picker" onclick="insertEmoji('😊')" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-200 rounded-full transition">
          <i data-lucide="smile" class="w-5 h-5"></i>
        </button>
        <button title="Attach File" onclick="showQuickAlert('File attachment: Photos, Documents, Audio')" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-200 rounded-full transition">
          <i data-lucide="paperclip" class="w-5 h-5"></i>
        </button>
        
        <!-- Input Form -->
        <form onsubmit="handleSendMessage(event)" class="flex-1 flex items-center">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..." 
            autocomplete="off"
            class="w-full py-2.5 px-4 bg-white rounded-lg text-sm text-gray-800 placeholder-gray-500 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-wa-green"
          >
        </form>

        <button 
          id="sendBtn" 
          onclick="handleSendMessage(event)" 
          class="p-2.5 bg-wa-green hover:bg-wa-greenDark text-white rounded-full transition shadow-sm active:scale-95 flex items-center justify-center"
        >
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </div>

    </section>

  </main>

  <!-- ============================================== -->
  <!-- 3. IOS CALLING MODAL (VOICE & VIDEO CALLS)     -->
  <!-- ============================================== -->
  <div id="callOverlay" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-xl flex flex-col justify-between items-center p-6 text-white transition-opacity duration-300">
    
    <!-- Top Call Info -->
    <div class="flex flex-col items-center mt-8">
      <div class="flex items-center gap-2 mb-2 px-3 py-1 rounded-full bg-white/10 text-xs font-medium text-emerald-300">
        <i data-lucide="lock" class="w-3 h-3"></i>
        <span>End-to-End Encrypted Call</span>
      </div>
      <h2 id="callingContactName" class="text-2xl font-bold text-white tracking-wide">Sarah Jenkins</h2>
      <p id="callStatusText" class="text-sm text-emerald-400 mt-1 animate-pulse">Ringing...</p>
    </div>

    <!-- Center Call Visual (Avatar with pulsing rings or simulated camera) -->
    <div class="relative flex items-center justify-center my-auto">
      <div id="callRingPulse" class="absolute w-44 h-44 rounded-full bg-emerald-500/20 animate-ping"></div>
      <div class="relative w-36 h-36 rounded-full p-1 bg-gradient-to-tr from-wa-green to-teal-400 shadow-2xl">
        <img id="callingContactAvatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&h=300&fit=crop&crop=faces" class="w-full h-full object-cover rounded-full">
      </div>
      
      <!-- Video PiP Preview Box (If Video Call) -->
      <div id="videoPip" class="hidden absolute -bottom-16 -right-20 w-24 h-32 rounded-2xl bg-gray-800 border-2 border-white/30 overflow-hidden shadow-2xl flex items-center justify-center">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-2 text-[9px] bg-black/60 px-1 rounded text-white">You</span>
      </div>
    </div>

    <!-- Call Control Action Buttons (Mute, Camera, Speaker, End) -->
    <div class="flex items-center gap-6 mb-8">
      <!-- Mute Toggle -->
      <button onclick="toggleCallMute(this)" class="w-13 h-13 p-3.5 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur-md transition flex flex-col items-center">
        <i data-lucide="mic" class="w-6 h-6 text-white"></i>
      </button>

      <!-- Video Toggle -->
      <button onclick="toggleCallVideo(this)" class="w-13 h-13 p-3.5 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur-md transition flex flex-col items-center">
        <i data-lucide="video" class="w-6 h-6 text-white"></i>
      </button>

      <!-- End Call Button -->
      <button onclick="endCall()" class="w-16 h-16 p-4 rounded-full bg-red-600 hover:bg-red-700 shadow-lg shadow-red-600/50 transition active:scale-90 flex items-center justify-center">
        <i data-lucide="phone-off" class="w-7 h-7 text-white"></i>
      </button>
    </div>

  </div>

  <!-- Subtle Notification Toast -->
  <div id="notificationToast" class="fixed bottom-6 z-50 bg-slate-900/90 backdrop-blur-md border border-white/20 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMessage">Notification</span>
  </div>

  <script>
    // State Management
    let currentUser = {
      email: 'alex.miller@gmail.com',
      name: 'Alex Miller',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces'
    };

        online: true,
        chatHistory: [
          { sender: "Rahul", text: "Team, status on the audio/video signaling server?", time: "Yesterday", fromMe: false },
          { sender: "Priya", text: "Backend WebSockets deployed smoothly.", time: "Yesterday", fromMe: false }
        ]
      },
      {
        id: 4,
        name: "Elena Rostova",
        avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&h=100&fit=crop&crop=faces",
        lastMsg: "Shared the Figma mockups with you.",
        time: "Wednesday",
        unread: 0,
        online: false,
        chatHistory: [
          { sender: "Elena", text: "Shared the Figma mockups with you.", time: "Wednesday", fromMe: false }
        ]
      }
    ];

    let activeContactId = 1;
    let callTimerInterval = null;
    let callSeconds = 0;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function fillDemoCredentials() {
      document.getElementById('emailInput').value = "alex.miller@gmail.com";
      document.getElementById('passwordInput').value = "iosGlass2026@!";
      showToast("Demo Gmail and Password auto-filled!");
    }

    function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!email || !password) {
        showToast("Please enter both Gmail and Password");
        return;
      }

      // UI Loading state
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const signInBtn = document.getElementById('signInBtn');

      btnText.textContent = "Verifying Credentials...";
      btnSpinner.classList.remove('hidden');
      signInBtn.disabled = true;

      setTimeout(() => {
        // Derive user display name from email
        const derivedName = email.split('@')[0].replace(/[._]/g, ' ')
          .replace(/\b\w/g, l => l.toUpperCase());

        currentUser.email = email;
        currentUser.name = derivedName || "Alex Miller";

        // Update WhatsApp Profile view
        document.getElementById('userNameDisplay').textContent = currentUser.name;
        document.getElementById('userEmailDisplay').textContent = currentUser.email;

        // Transition Screen
        const loginView = document.getElementById('loginView');
        const appView = document.getElementById('appView');

        loginView.classList.add('opacity-0', 'scale-95');
        
        setTimeout(() => {
          loginView.classList.add('hidden');
          appView.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
          btnText.textContent = "Sign In to WhatsApp";
          signInBtn.disabled = false;
          
          renderContactsList();
          renderActiveChat();
          showToast(`Welcome back, ${currentUser.name}!`);
          lucide.createIcons();
        }, 500);

      }, 1000);
    }

    function handleLogout() {
      const confirmLogout = window.confirm("Are you sure you want to log out?");
      if (!confirmLogout) return;

      const loginView = document.getElementById('loginView');
      const appView = document.getElementById('appView');

      appView.classList.add('hidden');
      loginView.classList.remove('hidden');
      setTimeout(() => {
        loginView.classList.remove('opacity-0', 'scale-95');
      }, 50);

      showToast("Logged out successfully.");
    }

    function renderContactsList(filterText = '') {
      const container = document.getElementById('chatsListContainer');
      container.innerHTML = '';

      const filtered = contactsData.filter(c => 
        c.name.toLowerCase().includes(filterText.toLowerCase()) || 
        c.lastMsg.toLowerCase().includes(filterText.toLowerCase())
      );

      filtered.forEach(contact => {
        const isActive = contact.id === activeContactId;
        const item = document.createElement('div');
        item.className = `flex items-center gap-3 px-4 py-3 cursor-pointer transition ${isActive ? 'bg-[#f0f2f5]' : 'hover:bg-[#f5f6f6]'}`;
        item.onclick = () => selectContact(contact.id);

        item.innerHTML = `
          <div class="relative flex-shrink-0">
            <img src="${contact.avatar}" class="w-12 h-12 rounded-full object-cover">
            ${contact.online ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-wa-green border-2 border-white rounded-full"></span>' : ''}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-sm font-medium text-gray-900 truncate">${contact.name}</h4>
              <span class="text-[11px] text-gray-400">${contact.time}</span>
            </div>
            <div class="flex items-center justify-between">
              <p class="text-xs text-gray-500 truncate max-w-[210px]">${contact.lastMsg}</p>
              ${contact.unread > 0 ? `<span class="bg-wa-green text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-4 text-center">${contact.unread}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    function selectContact(id) {
      activeContactId = id;
      const contact = contactsData.find(c => c.id === id);
      if (contact) {
        contact.unread = 0;
      }
      renderContactsList();
      renderActiveChat();
    }

    function handleSearchContact(e) {
      renderContactsList(e.target.value);
    }

    function renderActiveChat() {
      const contact = contactsData.find(c => c.id === activeContactId);
      if (!contact) return;

      // Update Header info
      document.getElementById('activeContactAvatar').src = contact.avatar;
      document.getElementById('activeContactName').textContent = contact.name;
      document.getElementById('activeContactStatus').textContent = contact.online ? 'online' : 'offline';

      const messagesContainer = document.getElementById('messagesContainer');
      messagesContainer.innerHTML = '';

      // Date pill indicator
      const datePill = document.createElement('div');
      datePill.className = "self-center bg-white/90 shadow-sm border border-gray-200 text-gray-600 text-[11px] font-medium px-3 py-1 rounded-lg my-2 uppercase tracking-wider";
      datePill.textContent = "Today";
      messagesContainer.appendChild(datePill);

      // Render Messages
      contact.chatHistory.forEach(msg => {
        const row = document.createElement('div');
        row.className = `flex w-full ${msg.fromMe ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        bubble.className = `max-w-[70%] sm:max-w-[60%] rounded-2xl px-3.5 py-2 text-sm shadow-sm relative leading-relaxed ${
          msg.fromMe 
            ? 'bg-[#d9fdd3] text-gray-900 rounded-tr-none' 
            : 'bg-white text-gray-900 rounded-tl-none border border-gray-100'
        }`;

        bubble.innerHTML = `
          <p class="pr-12 text-[13.5px]">${escapeHtml(msg.text)}</p>
          <div class="flex items-center justify-end gap-1 text-[10px] text-gray-500 float-right -mt-2">
            <span>${msg.time}</span>
            ${msg.fromMe ? '<i data-lucide="check-check" class="w-3.5 h-3.5 text-sky-500"></i>' : ''}
          </div>
        `;
        row.appendChild(bubble);
        messagesContainer.appendChild(row);
      });

      // Auto scroll to latest message
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      lucide.createIcons();
    }

    function handleSendMessage(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const contact = contactsData.find(c => c.id === activeContactId);
      if (!contact) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Append user message
      contact.chatHistory.push({
        sender: "Me",
        text: text,
        time: timeStr,
        fromMe: true
      });
      contact.lastMsg = text;
      contact.time = timeStr;

      input.value = '';
      renderActiveChat();
      renderContactsList();

      // Trigger automatic typing and response
      simulateContactResponse(contact);
    }

    function simulateContactResponse(contact) {
      const statusElem = document.getElementById('activeContactStatus');
      
      setTimeout(() => {
        if (contact.id === activeContactId) {
          statusElem.textContent = 'typing...';
          statusElem.classList.add('text-wa-green', 'font-medium');
        }
      }, 700);

      setTimeout(() => {
        const responses = [
          "That sounds awesome! Let's get on a call to talk through the details.",
          "Received! Checking it out on my side right now.",
          "I agree with this approach, thanks for the update!",
          "Great! Voice call me whenever you are free."
        ];
        const randomReply = responses[Math.floor(Math.random() * responses.length)];
        const replyTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        contact.chatHistory.push({
          sender: contact.name,
          text: randomReply,
          time: replyTime,
          fromMe: false
        });
        contact.lastMsg = randomReply;
        contact.time = replyTime;

        if (contact.id === activeContactId) {
          statusElem.textContent = 'online';
          statusElem.classList.remove('text-wa-green', 'font-medium');
          renderActiveChat();
        }
        renderContactsList();
      }, 2200);
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
    }

    function startCall(type = 'audio') {
      const contact = contactsData.find(c => c.id === activeContactId);
      if (!contact) return;

      const callOverlay = document.getElementById('callOverlay');
      const callingName = document.getElementById('callingContactName');
      const callingAvatar = document.getElementById('callingContactAvatar');
      const callStatusText = document.getElementById('callStatusText');
      const videoPip = document.getElementById('videoPip');

      callingName.textContent = contact.name;
      callingAvatar.src = contact.avatar;
      callStatusText.textContent = `Connecting ${type === 'video' ? 'Video' : 'Voice'} Call...`;

      if (type === 'video') {
        videoPip.classList.remove('hidden');
      } else {
        videoPip.classList.add('hidden');
      }

      callOverlay.classList.remove('hidden');

      // Simulate Call Answer
      callSeconds = 0;
      clearInterval(callTimerInterval);
      
      setTimeout(() => {
        callStatusText.classList.remove('animate-pulse');
        callTimerInterval = setInterval(() => {
          callSeconds++;
          const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
          const secs = String(callSeconds % 60).padStart(2, '0');
          callStatusText.textContent = `${mins}:${secs}`;
        }, 1000);
      }, 1800);
    }

    function endCall() {
      clearInterval(callTimerInterval);
      const callOverlay = document.getElementById('callOverlay');
      callOverlay.classList.add('hidden');
      showToast("Call ended");
    }

    function toggleCallMute(btn) {
      const icon = btn.querySelector('i');
      if (btn.classList.contains('bg-red-500/80')) {
        btn.classList.remove('bg-red-500/80');
        showToast("Microphone unmuted");
      } else {
        btn.classList.add('bg-red-500/80');
        showToast("Microphone muted");
      }
    }

    function toggleCallVideo(btn) {
      const pip = document.getElementById('videoPip');
      if (pip.classList.contains('hidden')) {
        pip.classList.remove('hidden');
        btn.classList.remove('bg-red-500/80');
        showToast("Camera turned on");
      } else {
        pip.classList.add('hidden');
        btn.classList.add('bg-red-500/80');
        showToast("Camera turned off");
      }
    }

    // Utilities
    function showToast(msg) {
      const toast = document.getElementById('notificationToast');
      const msgElem = document.getElementById('toastMessage');
      msgElem.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2800);
    }

    function showQuickAlert(msg) {
      showToast(msg);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize Lucide icons on boot
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
